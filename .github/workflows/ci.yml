name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & test (Qt 6.8, Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      # Runtime libs needed to render Qt Quick under the offscreen platform.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libopengl0 libxkbcommon0 \
            fontconfig fonts-dejavu-core

      # The generated qmlcache/qrc translation units are large; compiling them in
      # parallel on a 7 GB runner OOM-kills cc1plus. Add swap for headroom.
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/ci-swapfile
          sudo fallocate -l 10G /mnt/ci-swapfile
          sudo chmod 600 /mnt/ci-swapfile
          sudo mkswap /mnt/ci-swapfile
          sudo swapon /mnt/ci-swapfile
          free -h

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # Cap parallelism to 2 to bound peak memory during those heavy TUs.
      - name: Build
        run: cmake --build build --parallel 2

      - name: Test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
